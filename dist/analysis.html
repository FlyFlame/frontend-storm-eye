<!doctype html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analýza | GeoTrix</title><script defer="defer" src="analysis.bundle.js"></script></head><body><div id="site-header"></div><main class="page"><h1>Mapa</h1><div id="map" class="shared-map" aria-label="Interaktivní mapa"></div><section class="polygon-tools" aria-labelledby="polygon-title"><h2 id="polygon-title">Vytvořit polygon</h2><p>Klikni na mapu pro přidání vrcholů polygonu. Pro dokončení jsou potřeba alespoň tři body. WKT používá pořadí délka, šířka (EPSG:4326).</p><div class="polygon-actions"><button id="polygon-start" type="button">Kreslit nový polygon</button> <button id="polygon-finish" type="button" disabled="disabled">Dokončit polygon</button> <button id="polygon-cancel" type="button" disabled="disabled">Zrušit kreslení</button></div><label for="polygon-wkt">WKT souřadnice</label> <textarea id="polygon-wkt" rows="3" readonly="readonly" placeholder="Souřadnice polygonu se zobrazí zde."></textarea> <button id="polygon-copy" type="button" disabled="disabled">Kopírovat WKT</button><p id="polygon-status" class="polygon-status" aria-live="polite">Polygon zatím není vytvořen.</p></section></main></body></html>
